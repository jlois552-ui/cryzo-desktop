[package]
name = "cryzo-desktop"
workspace = "../../../native"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables child webviews, which the browser pane needs; "tray-icon" keeps Cryzo running in
# the tray after its window closes, so remote control stays connected.
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
keepawake = "0.6"
cryzo-engine = { path = "../../../native/engine" }
cryzo-desktop-control = { path = "../../../native/desktop-control" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
anyhow.workspace = true
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = "0.62.2"
