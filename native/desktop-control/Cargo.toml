[package]
name = "cryzo-desktop-control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Text-first desktop control (Windows UI Automation) and the cryzo-desktop-mcp stdio server"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cryzo-desktop-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22.1"
serde.workspace = true
serde_json.workspace = true

tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "=0.25.1", default-features = false, features = ["input", "pattern"] }
windows = { version = "0.62.2", features = [
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Ocr",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
# The overlay pill's text on macOS and Linux.
fontdue = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
# The overlay's windows, drawn by an AppKit helper process.
objc2 = "0.6"
objc2-foundation = "0.3"
foreign-types = "0.5"
accessibility-sys = "0.2"
core-foundation = "0.10"
# "highsierra" adds scroll-wheel events.
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio", "zbus"] }
jpeg-encoder = "0.7"
tokio = { workspace = true }
x11rb = { version = "0.14", features = ["randr", "shape", "xfixes", "xtest"] }
